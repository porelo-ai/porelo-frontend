name: Windows trial
run-name: "${{ github.workflow }} · ${{ github.ref_name }}: ${{ github.event.head_commit.message || github.workflow }}"

# A trial of the interface on Windows, for a branch under `windows/` only, so a Windows change is
# seen on GitHub's Windows runner before it reaches `main`. It publishes nothing, and its name says
# so: the Windows build that publishes is a job of the Build itself.
#
# Every wait is bounded. A test has a minute, the steps their own limits well under the job's, so a
# test that would wait for ever ends the run soon and names itself.
on:
  push:
    branches: ['windows/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Test and build on Windows
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: dart analyze --fatal-infos

      # A test marked `linux` needs what only Linux has: a pty, a unix socket, `chmod`, a Bash tool.
      # Each such mark says why in the test itself.
      - name: Test
        timeout-minutes: 20
        run: flutter test --exclude-tags linux --timeout 60s --reporter expanded --concurrency 1

      - name: Build
        timeout-minutes: 20
        run: flutter build windows --release
