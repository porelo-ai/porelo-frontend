name: Windows trial

# A trial of the interface on Windows, for a branch under `windows/` only, so a Windows change is
# seen on GitHub's Windows runner before it reaches `main`. It publishes nothing, and its name says
# so: the Windows build that publishes is a job of the Build itself.
#
# Every wait is bounded. A test has a minute, the steps their own limits well under the job's, so a
# test that would wait for ever ends the run soon and names itself.
on:
    push:
        branches: ['windows/**']
    workflow_dispatch:

permissions:
    contents: read

jobs:
    windows:
        name: Test and build on Windows
        # No host has a Windows runner, so a job there would wait for ever.
        if: vars.PORELO_PUBLISH == 'true'
        runs-on: windows-2025
        # Its steps' own limits add up to more than 60 minutes once Test may take 45.
        timeout-minutes: 75
        steps:
            # Without the job's token in .git/config: nothing here pushes with git.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            # The version read here, not by the action: from a file it installs yq through Chocolatey on Windows,
            # and a Chocolatey outage then reddens the build.
            - name: Read the pinned Flutter version
              id: flutter
              shell: bash
              run: |
                  version=$(sed -n 's/^ *flutter: *\([0-9][0-9.]*\) *$/\1/p' pubspec.yaml)
                  [ "$(printf '%s\n' "$version" | wc -l)" -eq 1 ] && [ -n "$version" ] ||
                      { echo "::error::pubspec.yaml pins no single Flutter version"; exit 1; }
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
              with:
                  flutter-version: ${{ steps.flutter.outputs.version }}
                  cache: true

            - name: Get dependencies
              run: |
                  flutter pub get
                  dart pub get --directory=packages/porelo_host

            - name: Analyze
              run: dart analyze --fatal-infos

            # A test marked `linux` needs what only Linux has: a pty, a unix socket, `chmod`, a Bash tool.
            # Each such mark says why in the test itself. The documents are checked by the Linux build.
            # The suite takes 17 to 19 minutes on the runner, and its speed varies.
            # The suite alone took about 32 minutes on windows-2025, running steadily (no test hung).
            - name: Test
              timeout-minutes: 45
              run: flutter test --exclude-tags "linux || documents" --timeout 60s --reporter expanded --concurrency 1

            - name: Build
              timeout-minutes: 20
              run: flutter build windows --release

            # The key files of this user before any key of the trial: the same list must stand at its end.
            - name: List the key files before
              shell: pwsh
              timeout-minutes: 2
              run: |
                  $ErrorActionPreference = 'Stop'
                  # The account's key files, CSP and CNG, read from disk: certutil fails on an account with none.
                  $keys = @(foreach ($dir in "$env:APPDATA\Microsoft\Crypto\RSA", "$env:APPDATA\Microsoft\Crypto\Keys") {
                    if (Test-Path -LiteralPath $dir) { Get-ChildItem -LiteralPath $dir -File -Recurse -Force | ForEach-Object FullName }
                  }) | Sort-Object
                  [IO.File]::WriteAllLines((Join-Path $env:RUNNER_TEMP 'keys-before.txt'), [string[]]@($keys))
                  "$(@($keys).Count) key files before the trial"

            # The trial proves installing without the real certificate ever reaching a branch.
            - name: Make a throwaway signing certificate
              shell: pwsh
              timeout-minutes: 2
              run: |
                  $ErrorActionPreference = 'Stop'
                  $certificate = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=porelo.ai' -CertStoreLocation Cert:\CurrentUser\My
                  try {
                    "WINDOWS_TRIAL_CERTIFICATE=$($certificate.Thumbprint)" >> $env:GITHUB_ENV
                    $password = [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(32))
                    $pfx = [Convert]::ToBase64String($certificate.Export(
                      [Security.Cryptography.X509Certificates.X509ContentType]::Pfx, $password))
                    "::add-mask::$password"
                    "::add-mask::$pfx"
                    "WINDOWS_SIGNING_PFX=$pfx" >> $env:GITHUB_ENV
                    "WINDOWS_SIGNING_PFX_PASSWORD=$password" >> $env:GITHUB_ENV
                  } finally {
                    # Pack takes the key from the PFX alone: the store's copy and its key go at once, on every path.
                    Remove-Item "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -DeleteKey -Force
                    $certificate.Dispose()
                  }

            # The carried collection beside the build, chosen and fetched as the Build's Windows job does: the next steps
            # check it.
            - name: The host collection this channel carries
              id: collection
              shell: bash
              env:
                  CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && 'releases' || 'snapshots' }}
              run: |
                  set -eu
                  dart pub get --directory=packages/porelo_host >/dev/null
                  line=$(tool/host_collection.sh "$CHANNEL")
                  read -r version digest file source <<< "$line"
                  echo "Carrying porelo-host collection $version, SHA-256 $digest, from $source"
                  { echo "version=$version"; echo "digest=$digest"; echo "file=$file"; } >> "$GITHUB_OUTPUT"

            - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              id: collection-cache
              with:
                  path: ~/.cache/porelo-pinned/collection
                  key: pinned-collection-${{ runner.os }}-${{ steps.collection.outputs.digest }}

            - name: Fetch the host collection
              shell: bash
              env:
                  # The job's token, for a download from https://github.com alone; none on a host's forge.
                  PORELO_PINNED_GITHUB_TOKEN: ${{ github.server_url == 'https://github.com' && github.token || '' }}
                  VERSION: ${{ steps.collection.outputs.version }}
                  DIGEST: ${{ steps.collection.outputs.digest }}
                  FILE: ${{ steps.collection.outputs.file }}
              run: |
                  PORELO_COLLECTION_CACHE="$HOME/.cache/porelo-pinned/collection" \
                    tool/fetch_collection.sh "$VERSION" "$DIGEST" build/windows/x64/runner/Release "$FILE"

            - if: steps.collection-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: ~/.cache/porelo-pinned/collection
                  key: pinned-collection-${{ runner.os }}-${{ steps.collection.outputs.digest }}

            - name: Ready the window's build
              shell: pwsh
              env:
                  # Compiled into porelo-host.exe, which then names the collection it carries.
                  PORELO_HOST_COLLECTION_VERSION: ${{ steps.collection.outputs.version }}
                  PORELO_HOST_COLLECTION_SHA256: ${{ steps.collection.outputs.digest }}
                  PORELO_HOST_COLLECTION_FILE: ${{ steps.collection.outputs.file }}
              run: ./tool/windows-prepare.ps1

            # Refused before anything is packed or any key is touched: a secret is empty.
            - name: Refuse to pack unsigned where signing is required
              shell: pwsh
              timeout-minutes: 5
              run: |
                  $ErrorActionPreference = 'Stop'
                  $env:WINDOWS_SIGNING_PFX = ''
                  $said = $null
                  try {
                    ./tool/windows-package.ps1 -Source build/windows/x64/runner/Release -Prefix porelo-frontend `
                      -Version $env:PORELO_WINDOWS_VERSION -Run $env:PORELO_WINDOWS_RUN -Out "$env:RUNNER_TEMP/refused" -RequireSigning
                  } catch { $said = "$_" }
                  if ($said -notmatch 'WINDOWS_SIGNING_PFX is empty') { throw "Asked for a refusal naming WINDOWS_SIGNING_PFX; got '$said'" }
                  if (Test-Path "$env:RUNNER_TEMP/refused/*.zip") { throw 'Asked to pack nothing; got a ZIP' }
                  "Refused: $said"

            # A failure between the key's import and SignTool leaves no key: the list at the end proves it.
            - name: Fail between the key's import and SignTool
              shell: pwsh
              timeout-minutes: 10
              run: |
                  $ErrorActionPreference = 'Stop'
                  $env:PORELO_WINDOWS_FAIL_BEFORE_SIGNING = 'yes'
                  $said = $null
                  try {
                    ./tool/windows-package.ps1 -Source build/windows/x64/runner/Release -Prefix porelo-frontend `
                      -Version $env:PORELO_WINDOWS_VERSION -Run $env:PORELO_WINDOWS_RUN -Out "$env:RUNNER_TEMP/failed" `
                      -ExpectedSignerThumbprint $env:WINDOWS_TRIAL_CERTIFICATE
                  } catch { $said = "$_" }
                  if ($said -notmatch 'fail before SignTool') { throw "Asked for the failure before SignTool; got '$said'" }
                  "Failed as asked: $said"

            - name: Pack
              shell: pwsh
              run: |
                  ./tool/windows-package.ps1 -Source build/windows/x64/runner/Release -Prefix porelo-frontend `
                    -Version $env:PORELO_WINDOWS_VERSION -Run $env:PORELO_WINDOWS_RUN `
                    -ExpectedSignerThumbprint $env:WINDOWS_TRIAL_CERTIFICATE

            - name: Install and start the MSIX
              shell: pwsh
              timeout-minutes: 12
              run: |
                  $ErrorActionPreference = 'Stop'
                  $msix = @(Get-ChildItem build/windows-zip/*.msix)
                  if ($msix.Count -eq 0) {
                    if ($env:WINDOWS_SIGNING_CONFIGURED -eq 'true') { throw 'Asked for a signed MSIX; got no MSIX after packing' }
                    'Skipped installing the MSIX: no signing secrets, so Pack did not keep an unsigned MSIX'
                    exit 0
                  }
                  if ($msix.Count -ne 1) { throw "Asked for one MSIX; got $($msix.Count)" }
                  ./tool/windows-install-check.ps1 -Msix $msix[0].FullName -Cer build/windows-zip/porelo-msix.cer `
                    -ExpectedIdentity ai.porelo.frontend `
                    -Leftovers '%APPDATA%\porelo', '%LOCALAPPDATA%\porelo', '%LOCALAPPDATA%\porelo-frontend'
              env:
                  WINDOWS_SIGNING_CONFIGURED: ${{ env.WINDOWS_SIGNING_PFX != '' }}

            # The same scripts serve another app: a console program from a ZIP made elsewhere, started
            # through its alias. A ZIP whose program is not the tested one is refused first.
            - name: Pack and install a second app
              shell: pwsh
              timeout-minutes: 15
              run: |
                  $ErrorActionPreference = 'Stop'
                  $work = Join-Path $env:RUNNER_TEMP 'second-app'
                  $files = Join-Path $work 'files'
                  $packaging = Join-Path $work 'packaging'
                  New-Item -ItemType Directory -Force -Path $files, $packaging | Out-Null
                  dart compile exe tool/windows-trial/sleeper.dart -o (Join-Path $work 'porelo_trial.exe')
                  if ($LASTEXITCODE -ne 0) { throw "Asked dart to compile the trial app; got exit $LASTEXITCODE" }
                  Copy-Item tool/windows-trial/AppxManifest.xml.in $packaging
                  Copy-Item -Recurse packaging/windows/assets (Join-Path $packaging 'assets')
                  $version = '0.0.1'
                  $zip = Join-Path $work "porelo-trial-$version-windows-x64.zip"

                  # Another program under the tested one's name.
                  Copy-Item "$env:SystemRoot\System32\whoami.exe" (Join-Path $files 'porelo_trial.exe')
                  Compress-Archive -Path (Join-Path $files '*') -DestinationPath $zip -Force
                  $said = $null
                  try {
                    ./tool/windows-package.ps1 -Zip $zip -Prefix porelo-trial -Version $version -Run 1 `
                      -Packaging $packaging -TestedExecutable (Join-Path $work 'porelo_trial.exe') `
                      -Out (Join-Path $work 'refused') -ExpectedSignerThumbprint $env:WINDOWS_TRIAL_CERTIFICATE
                  } catch { $said = "$_" }
                  if ($said -notmatch 'tested porelo_trial.exe') { throw "Asked for a refusal of the untested program; got '$said'" }
                  "Refused: $said"

                  Copy-Item -Force (Join-Path $work 'porelo_trial.exe') (Join-Path $files 'porelo_trial.exe')
                  Compress-Archive -Path (Join-Path $files '*') -DestinationPath $zip -Force
                  $out = Join-Path $work 'out'
                  ./tool/windows-package.ps1 -Zip $zip -Prefix porelo-trial -Version $version -Run 1 `
                    -Packaging $packaging -TestedExecutable (Join-Path $work 'porelo_trial.exe') `
                    -Out $out -ExpectedSignerThumbprint $env:WINDOWS_TRIAL_CERTIFICATE -RequireSigning
                  ./tool/windows-install-check.ps1 -Msix (Join-Path $out "porelo-trial-$version-windows-x64.msix") `
                    -Cer (Join-Path $out 'porelo-msix.cer') -ExpectedIdentity ai.porelo.windows-trial `
                    -Alias porelo-trial.exe -ReadyScript tool/windows-trial/ready.ps1 `
                    -Leftovers '%LOCALAPPDATA%\porelo-windows-trial'

            - name: Remove the throwaway signing certificate
              if: always()
              shell: pwsh
              timeout-minutes: 2
              run: |
                  $ErrorActionPreference = 'Stop'
                  if (-not $env:WINDOWS_TRIAL_CERTIFICATE) {
                    'No trial certificate was created'
                    exit 0
                  }
                  if ($env:WINDOWS_TRIAL_CERTIFICATE -notmatch '^[A-Fa-f0-9]{40}$') {
                    throw 'Asked for a trial certificate thumbprint; got an invalid thumbprint'
                  }
                  $path = "Cert:\CurrentUser\My\$env:WINDOWS_TRIAL_CERTIFICATE"
                  if (Test-Path $path) { Remove-Item $path -DeleteKey -Force }
                  if (Test-Path $path) { throw "Asked to remove '$path'; got an existing certificate" }
                  "No trial certificate $path is left"

            # Nothing of the trial's keys and apps is left on the machine, whatever failed before.
            - name: Find no key and no app file left
              if: always()
              shell: pwsh
              timeout-minutes: 2
              run: |
                  $ErrorActionPreference = 'Stop'
                  $before = Join-Path $env:RUNNER_TEMP 'keys-before.txt'
                  if (-not (Test-Path $before)) { 'No list of key files was made'; exit 0 }
                  $now = @(@(foreach ($dir in "$env:APPDATA\Microsoft\Crypto\RSA", "$env:APPDATA\Microsoft\Crypto\Keys") {
                    if (Test-Path -LiteralPath $dir) { Get-ChildItem -LiteralPath $dir -File -Recurse -Force | ForEach-Object FullName }
                  }) | Sort-Object)
                  $was = @(Get-Content $before)
                  $added = @($now | Where-Object { $_ -notin $was })
                  $left = [Collections.Generic.List[string]]::new()
                  if ($added.Count) { $left.Add("key files $($added -join ', ')") }
                  foreach ($path in "$env:APPDATA\porelo", "$env:LOCALAPPDATA\porelo", "$env:LOCALAPPDATA\porelo-frontend",
                      "$env:LOCALAPPDATA\porelo-windows-trial") {
                    if (Test-Path -LiteralPath $path) { $left.Add($path) }
                  }
                  $packages = @(Get-ChildItem "$env:LOCALAPPDATA\Packages" -Directory -ErrorAction SilentlyContinue |
                    Where-Object { $_.Name -like 'ai.porelo.*' })
                  foreach ($each in $packages) { $left.Add($each.FullName) }
                  if ($left.Count) { throw "Asked for nothing left of the trial; got $($left -join '; ')" }
                  "No key file and no app file left ($($now.Count) key files, as before)"

            # The built folder as it is, for a person to try on Windows: unpacked whole into a folder of
            # its own, since the code is in `data\app.so` beside the `.exe`.
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: porelo-frontend-windows
                  path: build/windows/x64/runner/Release/
                  if-no-files-found: error
