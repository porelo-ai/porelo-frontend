name: Shared rules check

# The build ignores the documents and leases a machine, so a change to the documents alone is
# checked here, with nothing leased: the shared rules block must still fit the hash its markers
# carry, no page or source may cite an issue, and the tests that read a document must pass.
# Once a day, not on a push: every hand-over runs the same checks locally on its exact commit first, and a run per
# push spent build minutes on what was already known. 03:17 UTC lies outside the hours the repositories are worked in.
on:
    schedule:
        - cron: '17 3 * * *'
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    check:
        name: The shared rules are unchanged copies, nothing cites an issue, and the documents hold
        runs-on: ubuntu-26.04
        timeout-minutes: 15
        steps:
            # Without the job's token in .git/config: nothing here pushes with git.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: ./.github/actions/pinned-jdk

            - name: Check that the shared rules are unchanged copies
              run: java -cp "$(cat build/jdk-cp.txt)" org.fuin.porelo.release.Main check-shared AGENTS.md .editorconfig

            - name: Check the citations, the documentation site and the READMEs
              run: |
                  java -cp "$(cat build/jdk-cp.txt)" org.fuin.porelo.release.Main check-citations .
                  java -cp "$(cat build/jdk-cp.txt)" org.fuin.porelo.release.Main check-readmes .
                  java -cp "$(cat build/jdk-cp.txt)" org.fuin.porelo.release.Main check-doc-site doc mkdocs.yml

            - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
              with:
                  flutter-version-file: pubspec.yaml
                  cache: true

            - name: Run the tests that read a document
              run: flutter test --tags documents

            # A pull request's own commits held to the shared rule on commit messages. One from outside - from another
            # repository, or opened by someone not a member - also carries its author's Signed-off-by: on each commit,
            # the Developer Certificate of Origin; Dependabot's and GitHub's own commits are exempt by the author and
            # committer they record.
            - name: The pull request's commit messages
              if: github.event_name == 'pull_request'
              env:
                  PR_BASE: ${{ github.event.pull_request.base.sha }}
                  PR_HEAD: ${{ github.event.pull_request.head.sha }}
                  PR_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
                  PR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
              run: |
                  set -eu
                  # The checkout holds the merge commit alone; the range needs the history of both its sides.
                  if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
                      git fetch --no-tags --quiet --unshallow origin "$PR_BASE" "$PR_HEAD"
                  else
                      git fetch --no-tags --quiet origin "$PR_BASE" "$PR_HEAD"
                  fi
                  outside=--outside
                  if [ "$PR_REPOSITORY" = "$GITHUB_REPOSITORY" ]; then
                      case "$PR_ASSOCIATION" in OWNER | MEMBER) outside= ;; esac
                  fi
                  java -cp "$(cat build/jdk-cp.txt)" org.fuin.porelo.release.Main \
                      check-commits "$PR_BASE..$PR_HEAD" $outside
