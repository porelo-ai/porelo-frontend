name: Artifactory probe test

# Proves the token can do the thing that fails silently.
#
# A `.deb` upload carries its properties as matrix parameters on the path, and Artifactory only
# indexes a package that has them.
# **Setting properties needs Annotate permission as well as Deploy — and without Annotate the
# upload still succeeds and the properties are quietly dropped.** The package is then stored, `apt`
# sees nothing, and no error appears anywhere.
#
# So this uploads a probe file, sets a property, reads it back, and fails loudly if it cannot.
# Run it before trusting a first publish, and after any change to the token.
on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    probe:
        name: Can the token annotate?
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        steps:
            # As Publish does it: the token reaches curl on standard input, never a command line or a file.
            - name: Give curl the address
              env:
                  JF_URL: ${{ vars.JF_URL }}
                  JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
              run: |
                  set -u
                  test -n "$JF_ACCESS_TOKEN" || { echo "::error::secrets.JF_ACCESS_TOKEN is not set" >&2; exit 1; }
                  base="$JF_URL"
                  while [ "${base%/}" != "$base" ]; do base="${base%/}"; done
                  base="${base%/artifactory}"
                  test -n "$base" || { echo "::error::vars.JF_URL is not set" >&2; exit 1; }
                  echo "ART_BASE=$base/artifactory" >> "$GITHUB_ENV"

            - name: Upload a probe with a property, and read it back
              env:
                  JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
              run: |
                  set -euo pipefail
                  auth() { printf 'header = "Authorization: Bearer %s"\n' "$JF_ACCESS_TOKEN"; }
                  probe="probe-${GITHUB_RUN_ID}.txt"
                  echo "written by ${GITHUB_WORKFLOW} run ${GITHUB_RUN_ID}" > "$probe"
                  target="porelo-dist-deb/pool/main/p/porelo-frontend/"

                  auth | curl -fsS -K - -o /dev/null \
                    -H "X-Checksum-Sha1: $(sha1sum "$probe" | cut -d' ' -f1)" \
                    -H "X-Checksum-Sha256: $(sha256sum "$probe" | cut -d' ' -f1)" \
                    -T "$probe" "$ART_BASE/${target}${probe};deb.distribution=probe;deb.component=main;deb.architecture=amd64"

                  # The upload succeeding proves nothing. What matters is whether the property is there.
                  properties="$(auth | curl -fsS -K - "$ART_BASE/api/storage/${target}${probe}?properties")"
                  echo "$properties"
                  case "$properties" in
                    *deb.distribution*) echo "Annotate works: the property came back." ;;
                    *)
                      echo "::error::the upload succeeded and the property was dropped — the token can" \
                           "Deploy but not Annotate, so every package would be stored and never indexed" >&2
                      exit 1
                      ;;
                  esac

            - name: Take the probe away again
              if: always()
              env:
                  JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
              run: |
                  test -n "${ART_BASE:-}" && printf 'header = "Authorization: Bearer %s"\n' "$JF_ACCESS_TOKEN" \
                    | curl -fsS -K - -o /dev/null -X DELETE \
                    "$ART_BASE/porelo-dist-deb/pool/main/p/porelo-frontend/probe-${GITHUB_RUN_ID}.txt" || true
