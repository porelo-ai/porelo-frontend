# Deletes this repository's workflow run history up to a date, to keep the Actions list readable, and every cache entry
# but the newest of its kind, so the cache never fills up.
name: Delete old runs

on:
    # Every day, the cache entries alone.
    schedule:
        - cron: '17 3 * * *'
    workflow_dispatch:
        inputs:
            before:
                description: 'Delete runs from this day and earlier (YYYY-MM-DD)'
                required: true
            delete:
                description: 'Actually delete runs and cache entries. Left unticked, this only says what would go.'
                type: boolean
                default: false

# Nothing for the workflow as a whole: the one permission this needs is given to the one job that deletes.
permissions: {}

jobs:
    delete:
        name: Old runs and cache entries
        # It calls the central forge's API.
        if: vars.PORELO_PUBLISH == 'true'
        # The only permission this needs, and it is the one that lets it delete.
        permissions:
            actions: write
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        steps:
            # Only when asked, with a date.
            - name: Runs up to ${{ inputs.before }} - what would go, and go if asked
              if: github.event_name == 'workflow_dispatch'
              env:
                  GH_TOKEN: ${{ github.token }}
                  BEFORE: ${{ inputs.before }}
                  DELETE: ${{ inputs.delete }}
              run: |
                  set -euo pipefail

                  # A malformed date matches nothing and reads as "there was nothing to delete".
                  if ! [[ "$BEFORE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
                      echo "::error::'$BEFORE' is not a date. Use YYYY-MM-DD."
                      exit 1
                  fi

                  gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
                      --jq '.workflow_runs[] | [.id, (.created_at | split("T")[0]), .status, .name] | @tsv' \
                      > all.tsv

                  # Dates in this form compare as text exactly as they do in time, and the named day
                  # counts as "equal". This run is excluded: it cannot delete itself while it runs.
                  awk -F'\t' -v b="$BEFORE" -v self="$GITHUB_RUN_ID" \
                      '$2 <= b && $1 != self' all.tsv > doomed.tsv || true

                  total=$(wc -l < all.tsv)
                  count=$(wc -l < doomed.tsv)
                  echo "$count of $total run(s) are from $BEFORE or earlier"
                  echo "## Runs up to $BEFORE" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "\`$count\` of \`$total\` runs match." >> "$GITHUB_STEP_SUMMARY"

                  if [ "$count" -eq 0 ]; then
                      echo "nothing to do" >> "$GITHUB_STEP_SUMMARY"
                      exit 0
                  fi

                  cut -f2,4 doomed.tsv | sort | uniq -c | sort -rn | head -20

                  if [ "$DELETE" != "true" ]; then
                      echo "nothing was deleted - run again with 'delete' ticked"
                      echo "" >> "$GITHUB_STEP_SUMMARY"
                      echo "**Nothing was deleted.** Run again with \`delete\` ticked." >> "$GITHUB_STEP_SUMMARY"
                      exit 0
                  fi

                  # A run still in progress answers 409 rather than deleting; that is a warning, not a
                  # failure, because the rest of the sweep is still worth doing.
                  gone=0
                  kept=0
                  while IFS=$'\t' read -r id day status name; do
                      if gh api -X DELETE "/repos/$GITHUB_REPOSITORY/actions/runs/$id" >/dev/null 2>&1; then
                          gone=$((gone + 1))
                      else
                          kept=$((kept + 1))
                          echo "::warning::could not delete run $id from $day ($status, $name)"
                      fi
                  done < doomed.tsv

                  echo "deleted $gone, could not delete $kept"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "Deleted \`$gone\`, could not delete \`$kept\`." >> "$GITHUB_STEP_SUMMARY"

            # Only the newest entry of each kind is kept. A build keys what it takes from outside by its pin - a
            # digest, a version, a hash of a list - as the last part of the key after a `-`; what comes before
            # it names the kind, such as `pinned-image-debian:13` or `pinned-apt-build-ubuntu22`. A ref's entries
            # are its own, so of the entries of one kind on one ref all but the newest go. GitHub itself still
            # removes an entry nobody read for seven days, which takes what a kind no longer in use left behind.
            - name: Cache entries not the newest of their kind - what would go, and go on schedule or if asked
              env:
                  GH_TOKEN: ${{ github.token }}
                  DELETE: ${{ github.event_name == 'schedule' || inputs.delete }}
              run: |
                  set -euo pipefail

                  gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" \
                      --jq '.actions_caches[] | [.id, .ref, .key, .created_at] | @tsv' > caches.tsv

                  # Newest first; times in this form compare as text exactly as they do in time. The first of a
                  # kind on a ref is kept, every later one goes.
                  sort -t $'\t' -k4,4r caches.tsv | awk -F'\t' '{
                      kind = $3
                      sub(/-[^-]*$/, "", kind)
                      if (($2, kind) in kept) print
                      else kept[$2, kind] = 1
                  }' > stale.tsv

                  total=$(wc -l < caches.tsv)
                  count=$(wc -l < stale.tsv)
                  echo "$count of $total cache entries are not the newest of their kind"
                  {
                      echo "## Cache entries"
                      echo ""
                      echo "\`$count\` of \`$total\` entries are not the newest of their kind."
                  } >> "$GITHUB_STEP_SUMMARY"
                  cut -f2,3,4 stale.tsv

                  if [ "$count" -eq 0 ]; then
                      exit 0
                  fi
                  if [ "$DELETE" != "true" ]; then
                      echo "nothing was deleted - run again with 'delete' ticked"
                      echo "**Nothing was deleted.** Run again with \`delete\` ticked." >> "$GITHUB_STEP_SUMMARY"
                      exit 0
                  fi

                  # An entry another run removed meanwhile answers 404: a warning, and the sweep goes on.
                  gone=0
                  kept=0
                  while IFS=$'\t' read -r id ref key created; do
                      if gh api -X DELETE "/repos/$GITHUB_REPOSITORY/actions/caches/$id" >/dev/null 2>&1; then
                          gone=$((gone + 1))
                      else
                          kept=$((kept + 1))
                          echo "::warning::could not delete cache entry $key of $ref from $created"
                      fi
                  done < stale.tsv

                  echo "deleted $gone, could not delete $kept"
                  echo "Deleted \`$gone\`, could not delete \`$kept\`." >> "$GITHUB_STEP_SUMMARY"
