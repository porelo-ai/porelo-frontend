# The JDK Maven runs on, installed from the pin in Porelo's machine tool rather than by a moving name.
#
# `setup-java` with '25' took whichever 25 was newest, checked against nothing we chose. This takes
# the GraalVM that `porelo-machines` pins (version, URL and sha256 in its pom, moved by Porelo's daily
# job under its three-day rule), checks the archive before unpacking it, and sets JAVA_HOME and PATH
# for the job: one pin, one mover, one digest for every Porelo repository. The runner's own Java 25
# only runs the tool; nothing it builds is published.
name: The pinned JDK
description: Installs the GraalVM porelo-machines pins, checked against its digest, for Maven.
runs:
    using: composite
    steps:
        # Maven's repository, which setup-java cached before, and the wrapper's Maven, so a run does not
        # hang on repo.maven.apache.org answering (mvnw checks the zip's sha256 when it downloads it).
        - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
              path: |
                  ~/.m2/repository
                  ~/.m2/wrapper
              key: maven-${{ runner.os }}-${{ hashFiles('pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
              restore-keys: maven-${{ runner.os }}-

        # Every pinned download is kept by its digest and checked again after a cache hit; pinned.sh beside this file
        # holds the one rule by which a download is tried again (about 15 minutes of pauses before red).
        - name: The shared build tools, and the pinned GraalVM's digest
          id: graalvm-pin
          shell: bash
          run: |
              set -eu
              . "$GITHUB_ACTION_PATH/pinned.sh"
              [ -n "${JAVA_HOME_25_X64:-}" ] || { echo "::error::this runner has no Java 25"; exit 1; }
              export JAVA_HOME="$JAVA_HOME_25_X64"
              mkdir -p build
              # The wrapper fetches its Maven once, checks it against distributionSha256Sum and installs it only whole,
              # so asking it again after a failed fetch is a retry; a cached one answers at once.
              pinned_retry "the wrapper's Maven" ./mvnw -B -q --version >/dev/null
              # -U: the Porelo tools are snapshots, and a cache restored from earlier the same day would
              # otherwise keep an older check-actions than the one published.
              ./mvnw -B -q -U -s settings.xml -Pci-tools dependency:build-classpath \
                -Dmdep.outputFile=build/jdk-cp.txt
              sha256=$("$JAVA_HOME/bin/java" -cp "$(cat build/jdk-cp.txt)" \
                  org.fuin.porelo.machines.Main jdk --print-sha256)
              [[ $sha256 =~ ^[0-9a-f]{64}$ ]] || { echo "::error::porelo-machines named no pinned digest"; exit 1; }
              echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

        - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          id: graalvm-cache
          with:
              path: ~/.cache/porelo-pinned/graalvm
              key: pinned-graalvm-${{ steps.graalvm-pin.outputs.sha256 }}

        - name: Install the pinned GraalVM
          shell: bash
          run: |
              set -eu
              "$JAVA_HOME_25_X64/bin/java" -cp "$(cat build/jdk-cp.txt)" \
                  org.fuin.porelo.machines.Main jdk --github --cache "$HOME/.cache/porelo-pinned/graalvm"

        - if: steps.graalvm-cache.outputs.cache-hit != 'true'
          uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
              path: ~/.cache/porelo-pinned/graalvm
              key: pinned-graalvm-${{ steps.graalvm-pin.outputs.sha256 }}

        # The shfmt the parent pins, which Spotless does not download: checked against the digest its
        # release names. Here, so every job that runs Maven's validate has it, not only the one that builds.
        - if: runner.os == 'Linux'
          uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          id: shfmt-cache
          with:
              path: ~/.cache/porelo-pinned/shfmt
              key: pinned-shfmt-d9fbb2a9c33d13f47e7618cf362a914d029d02a6df124064fff04fd688a745ea

        - name: The pinned shfmt
          if: runner.os == 'Linux'
          shell: bash
          run: |
              set -eu
              . "$GITHUB_ACTION_PATH/pinned.sh"
              VERSION=3.12.0
              pinned_fetch "https://github.com/mvdan/sh/releases/download/v$VERSION/shfmt_v${VERSION}_linux_amd64" \
                  d9fbb2a9c33d13f47e7618cf362a914d029d02a6df124064fff04fd688a745ea \
                  "$HOME/.cache/porelo-pinned/shfmt/shfmt"
              mkdir -p "$RUNNER_TEMP/bin"
              install -m 0755 "$HOME/.cache/porelo-pinned/shfmt/shfmt" "$RUNNER_TEMP/bin/shfmt"
              echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

        - if: runner.os == 'Linux' && steps.shfmt-cache.outputs.cache-hit != 'true'
          uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
              path: ~/.cache/porelo-pinned/shfmt
              key: pinned-shfmt-d9fbb2a9c33d13f47e7618cf362a914d029d02a6df124064fff04fd688a745ea
