work:
  Implementing:
    from: [Backlog, Rework]
    done: Review
    then: Reading
    per: repository
    modes: [UNATTENDED]
    order: "Build {issues} of {story}. Change only what the issues ask, not the tests already there. Before you end, propose one idea of your own for this project through Porelo, as your task's instructions describe proposing an idea: a title of one line and what must be true in one sentence."
    models: {pi: z-ai/glm-5.3-flash}
  Reading:
    from: [Implementing]
    done: Review
    blocked: Reworking
    per: story
    modes: [UNATTENDED]
    order: "Read {tasks}. Read every test of the repository as well: a test that cannot pass as it is written is a blocking finding, named with its file and line."
    models: {pi: z-ai/glm-5.3-flash}
  Reworking:
    from: [Reading]
    done: Review
    then: Reading
    per: repository
    modes: [UNATTENDED]
    order: "Rework {issues} of {story}: work off every blocking finding of the reading, a test that cannot pass among them."
    models: {pi: z-ai/glm-5.3-flash}
