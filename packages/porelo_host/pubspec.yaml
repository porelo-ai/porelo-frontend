name: porelo_host
description: "Puts a project on a server and takes it off again: rent, the playbook on the host, one stop for the person, give back."
publish_to: 'none'
version: 0.5.1-SNAPSHOT

environment:
    sdk: ^3.13.0

# No Flutter: the interface imports it, and `dart compile exe` builds the command from it.
dependencies: {dbus: ^0.8.0, ffi: ^2.2.0, win32: ^6.4.0, cryptography: ^2.9.0, crypto: ^3.0.7, path: ^1.9.1}

dev_dependencies:
    lints: ^6.0.0
    test: ^1.26.0
    yaml: ^3.1.4
